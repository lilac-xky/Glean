name: Frontend CI

# 前端 CI（Vue 3 + Vite）：只做必要校验——装依赖、类型检查、构建。
# 后端见 .github/workflows/backend-ci.yml
on:
  push:
    branches: [ master, main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

# 同一分支的新提交会取消旧的运行
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Type Check & Build (Node 22)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # package.json 的 engines 要求 ^22.18.0 || >=24.12.0，这里取最新的 22.x LTS
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 显式锁定 npm 11：当前 package-lock.json 由 npm 11 生成，
      # npm 10（Node 22 自带）在解析 chokidar 这类可选 peer 依赖时会判定 lockfile 不同步，
      # 导致 `npm ci` 报 EUSAGE 失败。锁定版本可避免这类环境漂移。
      - name: Install npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build-only
