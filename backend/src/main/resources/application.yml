spring:
  profiles:
    active: dev
  application:
    name: Glean

server:
  port: 9090
  servlet:
    context-path: /api

# MyBatis Flex 配置
mybatis-flex:
  configuration:
    map-underscore-to-camel-case: false
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 鉴权配置
glean:
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:}
    token-expire-seconds: 7200
    issuer: glean